    <script>
      (function () {
        var root = document.documentElement;
        try {
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            root.dataset.intro = "none";
            return;
          }
          if (sessionStorage.getItem("hero-intro") === "done") {
            root.dataset.intro = "short";
            return;
          }
          sessionStorage.setItem("hero-intro", "done");
          root.dataset.intro = "play";
          root.classList.add("intro-lock");
        } catch (error) {
          root.dataset.intro = "none";
        }
      })();
    </script>

    <noscript>
      <style>
        .intro-hidden,
        .hero-rise,
        .hero-late,
        .hero-scene-in {
          animation: none !important;
          opacity: 1 !important;
          visibility: visible !important;
          transform: none !important;
        }

        html.intro-lock,
        html.intro-lock body {
          overflow: visible !important;
        }
      </style>
    </noscript>
